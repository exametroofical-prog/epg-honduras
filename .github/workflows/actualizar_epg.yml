name: Actualizar EPG

on:
  schedule:
    # Cada 3 horas (a los 7 min). 06:07 UTC = 00:07 en Honduras, justo al cambiar el día.
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo probar (no escribe en Firebase)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: epg
  cancel-in-progress: false

jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Subir programación a Firebase
        run: python scraper.py
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

      - name: Guardar programacion.json y programacion.txt en el repo
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programacion.json programacion.txt || true
          git diff --cached --quiet || git commit -m "EPG $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
